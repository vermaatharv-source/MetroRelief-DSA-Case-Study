name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests (44)
        run: python tests/test_metrorelief.py -v
      - name: Reproduce case-study samples
        run: python run_samples.py
      - name: Run 100-incident integration demo
        run: python demo.py
